spring.application.name=medwise
server.port=${PORT:${SERVER_PORT:8080}}

# File-based H2 so local data survives restarts. Profile "prod" switches to Postgres.
spring.datasource.url=jdbc:h2:file:./data/medwise;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

exa.api-key=${EXA_API_KEY:}
exa.base-url=https://api.exa.ai
exa.num-results=5

medwise.disclaimer=MedWise provides general health information and is not a substitute for professional medical advice. Do not use this app to diagnose a condition, change prescribed treatment, or make emergency medical decisions. Consult a qualified doctor or pharmacist for advice specific to your situation.
medwise.default-user-id=1
medwise.cors.allowed-origin-patterns=*
